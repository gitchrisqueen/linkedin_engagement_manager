name: GitGuardian Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Supersede a PR's own in-flight runs when it is pushed to again. cancel-in-progress is gated to
# pull_request ON PURPOSE: these workflows also run on merge_group, and cancelling a merge-queue run
# fails that queue entry and evicts the PR -- the #1168/#1171 failure mode. It also protects the
# push:main runs that codeql_pr_gate.py's base-ref calibration reads from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the scan only needs to read the repo.
permissions:
  contents: read

jobs:
  scanning:
    name: GitGuardian Scan
    runs-on: ubuntu-latest
    # Skip conditions:
    #  - Dependabot PRs: dependency bumps don't introduce secrets.
    #  - PRs from forks: GitHub withholds repo/org secrets from fork PRs, so
    #    GITGUARDIAN_API_KEY is empty and ggshield fails with "Invalid API key".
    #    Fork PRs are scanned instead by the GitGuardian GitHub App check run
    #    ("GitGuardian Security Checks"), and again by this job on merge_group
    #    before anything lands on main.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history required for secret scanning

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
